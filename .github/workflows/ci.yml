name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: ccti-offline
          path: |
            dist/ccti.html
            dist/cxti.html
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html src _site/
          mkdir -p _site/assets && cp -r assets/types _site/assets/
          cp assets/card-light.png _site/assets/
          cp dist/ccti.html _site/ccti.html
          mkdir -p _site/codex && cp codex/index.html codex/*.js _site/codex/
          cp dist/cxti.html _site/codex/cxti.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
